<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi 装配图 · 从 main() 到第一次 prompt</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #2a2f3a; --text: #e6e9ef;
    --muted: #8b94a7; --accent: #7aa2f7; --accent2: #9ece6a; --warn: #e0af68;
    --card: #1d2129; --shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  html[data-theme="light"] {
    --bg: #f6f7f9; --panel: #ffffff; --line: #d9dde5; --text: #1b1f27;
    --muted: #5d6678; --accent: #2f5fd0; --accent2: #2f7d32; --warn: #9a6700;
    --card: #ffffff; --shadow: 0 6px 20px rgba(16,24,40,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 18px 24px;
    border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  .tabs { display: flex; gap: 6px; }
  .tab {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13px;
  }
  .tab[aria-selected="true"] { color: var(--text); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .theme {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 12px;
  }
  main { display: grid; grid-template-columns: minmax(420px, 1fr) 380px; gap: 20px; padding: 24px; align-items: start; }
  @media (max-width: 920px) { main { grid-template-columns: 1fr; } }

  .canvas { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
  .lane { display: flex; flex-direction: column; gap: 0; }
  .lane + .lane { margin-top: 4px; }
  .lane-label { color: var(--muted); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; margin: 4px 0 8px 2px; }
  .node {
    position: relative; display: grid; grid-template-columns: 96px 1fr; gap: 12px;
    border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 10px 12px; cursor: pointer; transition: border-color .15s, transform .15s;
  }
  .node:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .node[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
  .node .k { color: var(--muted); font-size: 12px; }
  .node .t { font-weight: 600; font-size: 13.5px; }
  .node .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .node .path { color: var(--accent2); font-size: 11.5px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .node.side { border-left: 3px solid var(--warn); }
  .arrow { height: 22px; margin-left: 44px; border-left: 1px dashed var(--line); position: relative; }
  .arrow::after {
    content: ""; position: absolute; left: -4px; bottom: -1px;
    border: 4px solid transparent; border-top-color: var(--line);
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
  aside {
    position: sticky; top: 86px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; box-shadow: var(--shadow); min-height: 260px;
  }
  aside h2 { margin: 0 0 6px; font-size: 14px; }
  aside .where { color: var(--accent2); font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; }
  aside p { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  aside ul { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  aside li + li { margin-top: 6px; }
  code { background: color-mix(in srgb, var(--accent) 12%, transparent); padding: 1px 5px; border-radius: 5px; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  .legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; margin-top: 14px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .hidden { display: none; }
  footer { color: var(--muted); font-size: 12px; padding: 0 24px 28px; }
</style>
</head>
<body>

  <div>
    <h1>pi 装配图</h1>
    <div class="sub">main@2c8d1feb1 · 点节点看代码位置</div>
  </div>
  <div class="spacer"></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="assembly" aria-selected="true">装配链路</button>
    <button class="tab" role="tab" data-view="tools" aria-selected="false">工具注册</button>
    <button class="tab" role="tab" data-view="inject" aria-selected="false">Skill / MCP 注入</button>
  </div>

</header>

    <p>左图里的每个方块都对应仓库里的一段真实代码。点一下，这里显示它负责什么、为什么这么分。</p>
  </aside>
</main>

<footer>

const canvas = document.getElementById("canvas");
const detail = document.getElementById("detail");
let currentView = "assembly";

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

function render(viewKey) {
  currentView = viewKey;
  const view = VIEWS[viewKey];
  const parts = [];
  view.lanes.forEach((lane, li) => {
    if (li > 0) parts.push('<div class="arrow"></div>');
    parts.push(`<div class="lane"><div class="lane-label">${esc(lane.label)}</div>`);
    const multi = lane.nodes.length > 1;
    parts.push(`<div class="${multi ? (lane.nodes.length > 2 ? "grid3" : "grid2") : ""}">`);
    for (const n of lane.nodes) {
      parts.push(`<div class="node${n.side ? " side" : ""}" data-id="${esc(n.id)}" aria-current="false">
        <div class="k">${esc(n.k)}</div>
        <div>
          <div class="t">${esc(n.t)}</div>
          <div class="d">${esc(n.d)}</div>
          <div class="path">${esc(n.path)}</div>
        </div>
      </div>`);
    }
    parts.push("</div></div>");
  });
  canvas.innerHTML = parts.join("");
  canvas.querySelectorAll(".node").forEach(el => {
    el.addEventListener("click", () => select(el.dataset.id));
  });
  const first = canvas.querySelector(".node");
  if (first) select(first.dataset.id);
}

function select(id) {
  const view = VIEWS[currentView];
  let node;
  for (const lane of view.lanes) {
    const hit = lane.nodes.find(n => n.id === id);
    if (hit) { node = hit; break; }
  }
  if (!node) return;
  canvas.querySelectorAll(".node").forEach(el => {
    el.setAttribute("aria-current", el.dataset.id === id ? "true" : "false");
  });
  detail.innerHTML = `
    <h2>${esc(node.t)}</h2>
    <div class="where">${esc(node.path)}</div>
    <p>${esc(node.body)}</p>
    <ul>${(node.bullets || []).map(b => `<li>${esc(b)}</li>`).join("")}</ul>
  `;
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", "false"));
    tab.setAttribute("aria-selected", "true");
    render(tab.dataset.view);
  });
});

document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light";
});

render("assembly");
</script>
